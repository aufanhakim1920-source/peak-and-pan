<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#573451">
  <title>Peak &amp; Pan</title>
  <meta name="description" content="Find it, hunt it, cook it. Peak & Pan — reworked prototype built from the team rocket Figma.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@400;500;600;700&family=Tilt+Neon&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-v2.css">
  <link rel="stylesheet" href="styles-v3.css">
  <link rel="stylesheet" href="styles-v4.css">
  <script>
    /* set the theme before first paint so there's no flash of the wrong one */
    (function () {
      var t = localStorage.getItem("peak-and-pan/theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <!-- three is vendored, not pulled from a CDN: the app has to work on a
       phone over local network with no internet, and on a locked-down
       school network where unpkg may be blocked -->
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>

  <a class="skip" href="#screen">Skip to content</a>

  <div class="phone">
    <div class="phone__screen">

      <div class="statusbar">
        <span class="statusbar__time" id="clock">9:41</span>
        <span class="statusbar__notch"></span>
        <span class="statusbar__right">
          <svg viewBox="0 0 18 12" width="17" height="11" aria-hidden="true">
            <rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/>
            <rect x="4.5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/>
            <rect x="9" y="3" width="3" height="9" rx="1" fill="currentColor"/>
            <rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/>
          </svg>
          <svg viewBox="0 0 16 12" width="15" height="11" aria-hidden="true">
            <path d="M8 10.5 5.8 8.3a3.1 3.1 0 0 1 4.4 0L8 10.5Z" fill="currentColor"/>
            <path d="M3.4 5.9a6.5 6.5 0 0 1 9.2 0" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            <path d="M1 3.5a9.9 9.9 0 0 1 14 0" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          </svg>
          <svg viewBox="0 0 26 12" width="25" height="11" aria-hidden="true">
            <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" fill="none" opacity=".5"/>
            <rect x="2" y="2" width="16" height="8" rx="1.5" fill="currentColor"/>
            <path d="M23 4v4a2.2 2.2 0 0 0 0-4Z" fill="currentColor" opacity=".5"/>
          </svg>
        </span>
      </div>

      <main id="screen" class="screen" tabindex="-1"></main>

      <!-- announcements for screen readers; the narrator writes here too -->
      <div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

      <!-- floating assistant, hidden on screens that own the whole surface -->
      <button class="ask" id="ask" type="button" aria-label="Ask the cook">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.6-.7L3 21l1.9-5A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z"/>
        </svg>
      </button>

      <nav class="hotbar" id="hotbar" aria-label="Main">
        <div class="hotbar__bar"></div>
        <button class="navitem" data-go="#/stage"><span data-tico="stage"></span><span>Mission</span></button>
        <button class="navitem" data-go="#/search"><span data-tico="search"></span><span>Search</span></button>
        <button class="navitem navitem--fab" data-go="#/globe">
          <span class="fab"><span data-tico="map"></span><span>Map</span></span>
        </button>
        <button class="navitem" data-go="#/quests"><span data-tico="quest"></span><span>Daily</span></button>
        <button class="navitem" data-go="#/profile"><span data-tico="profile"></span><span>Profile</span></button>
      </nav>

      <div class="sheet" id="sheet" hidden>
        <div class="sheet__scrim" data-close-sheet></div>
        <div class="sheet__panel" id="sheet-panel" role="dialog" aria-modal="true"></div>
      </div>

      <div class="toast" id="toast" hidden></div>
      <div class="xpfly" id="xpfly" hidden></div>

    </div>
  </div>

  <script src="config.js"></script>
  <!-- Live Supabase keys live in config.local.js, which is gitignored.
       Without it the app runs on the local driver — a 404 here is
       expected on a fresh clone and harmless. Ask Aufan for the file. -->
  <script src="config.local.js"></script>
  <script src="data.js"></script>
  <script src="story.js"></script>
  <script src="world.js"></script>
  <script src="db.js"></script>
  <script src="game.js"></script>
  <script src="speech.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
  <!-- one file per page, so two people can work on different screens
       without touching the same file. Order matters: ui.js first, the
       screens in any order, main.js last (it boots the router). -->
  <script src="ui.js"></script>
  <script src="screens/intro.js"></script>
  <script src="screens/stage.js"></script>
  <script src="screens/globe.js"></script>
  <script src="screens/dish.js"></script>
  <script src="screens/browse.js"></script>
  <script src="screens/progress.js"></script>
  <script src="screens/profile.js"></script>
  <script src="screens/chat.js"></script>
  <script src="main.js"></script>
  <script type="module">
    import { mountPlanet } from "./planet.js";
    window.mountPlanet = mountPlanet;
    window.dispatchEvent(new Event("planet-ready"));
  </script>
</body>
</html>
